<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="周浩 24001010105">
    <meta name="description" content="商品详情（fetch 根据 ID 获取接口数据）- 周浩 24001010105">
    <title>17-3 商品详情</title>
    <style>
        /* ============================================================
           17-3 商品详情页
           作者：周浩 24001010105 计科24001
           接口：https://dummyjson.com/products/{id} （支持跨域）
           商品 ID 来自列表页跳转时带的 URL 参数 ?id=xxx
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.7;
            padding: 24px 16px;
        }

        .box {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 6px;
        }

        .sub {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* 状态行 */
        .status {
            text-align: center;
            font-family: Consolas, monospace;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .status b {
            color: #0f766e;
        }

        .status.err b {
            color: #dc2626;
        }

        /* 返回列表 */
        .back {
            display: inline-block;
            margin-bottom: 14px;
            font-size: 14px;
            color: #4f46e5;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* 详情两栏 */
        .detail {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 22px;
        }

        /* 左侧图片区 */
        .gallery .main {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border: 1px solid #f1f5f9;
            border-radius: 10px;
            background: #fff;
            padding: 12px;
        }

        .thumbs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .thumbs img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            background: #fff;
            transition: border-color .2s;
        }

        .thumbs img:hover,
        .thumbs img.is-on {
            border-color: #4f46e5;
        }

        /* 右侧信息区 */
        .info h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .info .brand {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .info .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 12px;
            padding: 1px 9px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4f46e5;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }

        .price-row .now {
            font-family: Consolas, monospace;
            font-size: 30px;
            font-weight: 700;
            color: #dc2626;
        }

        .price-row .old {
            font-family: Consolas, monospace;
            color: #94a3b8;
            text-decoration: line-through;
        }

        .price-row .off {
            background: #ff455b;
            color: #fff;
            font-size: 12px;
            border-radius: 6px;
            padding: 1px 7px;
        }

        .sub-row {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .stock {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 6px;
            margin-bottom: 14px;
        }

        .stock.in {
            background: #ecfdf5;
            color: #047857;
        }

        .stock.low {
            background: #fffbeb;
            color: #b45309;
        }

        .desc {
            font-size: 14px;
            color: #475569;
            margin-bottom: 14px;
        }

        /* 保证 / 物流 / 退货 三格 */
        .policy {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .policy div {
            background: #f8fafc;
            border: 1px solid #eef2f6;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #475569;
        }

        .policy b {
            display: block;
            color: #1e293b;
            font-size: 13px;
            margin-bottom: 2px;
        }

        /* 买家评价 */
        .reviews h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .review {
            border-top: 1px dashed #e2e8f0;
            padding: 8px 0;
            font-size: 13px;
        }

        .review .who {
            color: #4f46e5;
            font-weight: 700;
        }

        .review .star {
            color: #f59e0b;
        }

        .review p {
            color: #475569;
        }

        /* 其他信息 */
        .extra {
            margin-top: 14px;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #94a3b8;
        }

        /* 加载中 / 错误 */
        .tip {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 14px;
        }

        .retry {
            display: block;
            margin: 0 auto;
            font: inherit;
            font-size: 14px;
            padding: 7px 18px;
            border: 1px solid #c7d2fe;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 8px;
            cursor: pointer;
        }

        .retry:hover {
            background: #4f46e5;
            color: #fff;
        }

        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 28px;
        }

        /* 响应式 */
        @media (max-width: 760px) {
            .detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>商品详情</h1>
        <div class="sub">作者：周浩　学号：24001010105　班级：计科24001　（根据 URL 中的 id 参数请求接口）</div>

        <div class="status" id="status">…</div>
        <a class="back" href="17-3.html">← 返回商品列表</a>

        <!-- 详情内容：数据由 fetch 渲染 -->
        <div id="detail">
            <div class="tip">加载中…</div>
        </div>

        <footer>周浩 · 高级网页设计 17-3 · 2026</footer>
    </div>

    <script>
        /* ============================================================
         * 17-3 商品详情 —— 作者：周浩 24001010105
         * fetch + async/await + 原生 JS，无任何库
         * ============================================================ */
        var box = document.getElementById('detail');
        var statusEl = document.getElementById('status');   /* 注意：全局变量不能叫 status（会撞上 window.status） */

        /* ① 从 URL 参数里取商品 id（列表页跳转时带上来的），默认 1 */
        var id = new URLSearchParams(location.search).get('id');
        if (!id || isNaN(Number(id)) || Number(id) < 1) {
            id = '1';
        }
        var API = 'https://dummyjson.com/products/' + id;

        /* 把评分画成一排星星 */
        function stars(n) {
            var full = Math.round(n);
            var s = '';
            for (var i = 1; i <= 5; i++) {
                s += i <= full ? '★' : '☆';
            }
            return s;
        }

        async function loadDetail() {
            statusEl.className = 'status';
            statusEl.innerHTML = '请求中… <b>' + API + '</b>';
            box.innerHTML = '<div class="tip">加载中…</div>';

            try {
                /* ② 发请求 */
                var res = await fetch(API + '?_=' + Date.now());
                /* ③ 404 / 500 都要自己判断 */
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status + (res.status === 404 ? '（商品不存在）' : ''));
                }
                /* ④ 解析 JSON */
                var p = await res.json();

                statusEl.innerHTML = '请求成功，状态码 <b>' + res.status + '</b>，商品 ID <b>' + p.id + '</b>';

                /* 原价 = 现价 / (1 - 折扣%) */
                var oldPrice = (p.price / (1 - p.discountPercentage / 100)).toFixed(2);
                var inStock = p.availabilityStatus === 'In Stock';
                var stockCls = inStock || p.stock > 10 ? 'in' : 'low';
                var stockText = p.availabilityStatus + '（库存 ' + p.stock + '）';

                /* 评价列表 */
                var reviewHtml = (p.reviews || []).map(function (r) {
                    return '<div class="review">' +
                        '<span class="who">' + r.reviewerName + '</span>' +
                        '　<span class="star">' + stars(r.rating) + '</span> ' + r.rating.toFixed(1) +
                        '　<span style="color:#94a3b8;font-size:12px">' + new Date(r.date).toLocaleDateString() + '</span>' +
                        '<p>“' + r.comment + '”</p></div>';
                }).join('');

                /* 主图 + 缩略图（点击缩略图切换主图） */
                var imgs = p.images && p.images.length ? p.images : [p.thumbnail];
                box.innerHTML = '' +
                    '<div class="detail">' +
                    '  <div class="gallery">' +
                    '    <img class="main" id="mainImg" src="' + imgs[0] + '" alt="' + p.title + '"' +
                    '         onerror="this.src=\'https://dummyjson.com/image/400x400/eee/999?text=No+Image\'">' +
                    '    <div class="thumbs">' +
                    imgs.map(function (src, i) {
                        return '<img src="' + src + '" data-i="' + i + '" class="' + (i === 0 ? 'is-on' : '') + '"' +
                            ' onerror="this.style.display=\'none\'">';
                    }).join('') +
                    '    </div>' +
                    '  </div>' +
                    '  <div class="info">' +
                    '    <h2>' + p.title + '</h2>' +
                    '    <div class="brand">品牌：' + (p.brand || '—') + '　·　SKU：' + p.sku + '</div>' +
                    '    <div class="tags"><span class="tag">' + p.category + '</span>' +
                    (p.tags || []).map(function (t) { return '<span class="tag">#' + t + '</span>'; }).join('') +
                    '    </div>' +
                    '    <div class="price-row">' +
                    '      <span class="now">$' + p.price.toFixed(2) + '</span>' +
                    '      <span class="old">$' + oldPrice + '</span>' +
                    '      <span class="off">-' + p.discountPercentage.toFixed(1) + '%</span>' +
                    '    </div>' +
                    '    <div class="sub-row">用户评分：<span style="color:#f59e0b">' + stars(p.rating) + '</span> ' +
                    p.rating.toFixed(2) + '　·　最小起订量 ' + p.minimumOrderQuantity + '</div>' +
                    '    <span class="stock ' + stockCls + '">' + stockText + '</span>' +
                    '    <div class="desc">' + p.description + '</div>' +
                    '    <div class="policy">' +
                    '      <div><b>🛡 保修</b>' + p.warrantyInformation + '</div>' +
                    '      <div><b>🚚 物流</b>' + p.shippingInformation + '</div>' +
                    '      <div><b>↩ 退货</b>' + p.returnPolicy + '</div>' +
                    '    </div>' +
                    '    <div class="reviews"><h3>买家评价（' + (p.reviews || []).length + ' 条）</h3>' +
                    (reviewHtml || '<div class="review">暂无评价</div>') + '</div>' +
                    '    <div class="extra">尺寸：' + p.dimensions.width + ' × ' + p.dimensions.height +
                    ' × ' + p.dimensions.depth + ' cm　·　重量：' + p.weight + ' g　·　条码：' + p.meta.barcode + '</div>' +
                    '  </div>' +
                    '</div>';

                /* 点击缩略图切换主图（原生事件委托） */
                var main = document.getElementById('mainImg');
                document.querySelector('.thumbs').addEventListener('click', function (e) {
                    if (e.target.tagName !== 'IMG') { return; }
                    main.src = e.target.src;
                    Array.prototype.forEach.call(this.children, function (t) {
                        t.classList.remove('is-on');
                    });
                    e.target.classList.add('is-on');
                });
            } catch (e) {
                statusEl.className = 'status err';
                statusEl.innerHTML = '请求失败：<b>' + e.message + '</b>';
                box.innerHTML = '<div class="tip">❌ 商品详情加载失败</div>' +
                    '<button class="retry" onclick="loadDetail()">↻ 重新加载</button>';
            }
        }

        loadDetail();
    </script>

</body>
</html>
