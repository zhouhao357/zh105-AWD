<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 选择器 - 偶数盒子悬浮效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 560px;
        }

        .box {
            width: 140px;
            height: 140px;
            background-color: blueviolet;
            margin: 10px;
            align-items: center;
            justify-content: center;
            display: flex;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 偶数个盒子鼠标悬停时的变化效果 */
        .box:nth-child(even):hover {
            background-color: #e74c3c;
            transform: scale(1.2) rotate(15deg);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.5);
        }

        /* 第11个盒子：默认显示数字，悬停时显示学号姓名 */
        .box:nth-child(11) {
            position: relative;
        }
        .box:nth-child(11) .num {
            display: flex;
        }
        .box:nth-child(11) .info {
            display: none;
        }
        .box:nth-child(11):hover .num {
            display: none;
        }
        .box:nth-child(11):hover .info {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }
        .box:nth-child(11) .info span:first-child {
            font-size: 22px;
        }
        .box:nth-child(11) .info span:last-child {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">
            <span class="num">11</span>
            <span class="info">
                <span>周浩</span>
                <span>24001010105</span>
            </span>
        </div>
        <div class="box">12</div>
    </div>
</body>
</html>
