<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-4 媒体查询响应式布局</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            background: #1a1a2e;
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
        }

        /* 个人信息头部 */
        .header {
            width: 100%;
            padding: 1.25rem 1rem;
            text-align: center;
            background: linear-gradient(135deg, #16213e, #0f3460);
            box-shadow: 0 0.125rem 0.625rem rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3rem;
            margin-bottom: 0.3rem;
            color: #e94560;
        }

        .header p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.15rem;
        }

        /* 容器 */
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 1rem;
            gap: 1rem;
        }

        /* 盒子基础样式 */
        .box {
            flex: 1 1 100%;
            min-width: 0;
            height: 10rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0.0625rem 0.0625rem 0.3125rem rgba(0, 0, 0, 0.4);
            box-shadow: 0 0.25rem 0.9375rem rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: translateY(-0.3125rem);
            box-shadow: 0 0.375rem 1.25rem rgba(0, 0, 0, 0.5);
        }

        .box .num {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .box .desc {
            font-size: 0.75rem;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.1rem;
        }

        /* 8种颜色 */
        .box:nth-child(1) { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .box:nth-child(2) { background: linear-gradient(135deg, #e67e22, #d35400); }
        .box:nth-child(3) { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .box:nth-child(4) { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .box:nth-child(5) { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .box:nth-child(6) { background: linear-gradient(135deg, #3498db, #2980b9); }
        .box:nth-child(7) { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .box:nth-child(8) { background: linear-gradient(135deg, #e84393, #d63031); }

        /* ====== Media Query 1: 超小屏 ~575px — 每行1个 ====== */
        /* 默认即 flex: 1 1 100%，无需额外规则 */

        /* ====== Media Query 2: 小屏 576px~767px — 每行2个 ====== */
        @media (min-width: 576px) {
            .box {
                flex: 1 1 calc(50% - 1rem);
            }
            .header h1 {
                font-size: 1.75rem;
            }
        }

        /* ====== Media Query 3: 中屏 768px~991px — 每行3个 ====== */
        @media (min-width: 768px) {
            .box {
                flex: 1 1 calc(33.333% - 1rem);
            }
            .header h1 {
                font-size: 2rem;
            }
            .header p {
                font-size: 1rem;
            }
        }

        /* ====== 扩展 Media Query 4: 大屏 992px~1199px — 每行4个 ====== */
        @media (min-width: 992px) {
            .box {
                flex: 1 1 calc(25% - 1rem);
            }
        }

        /* ====== 扩展 Media Query 5: 超大屏 ≥1200px — 每行8个 ====== */
        @media (min-width: 1200px) {
            .box {
                flex: 1 1 calc(12.5% - 1rem);
                height: 12rem;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
            }
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>

    <!-- 个人信息 -->
    <header class="header">
        <h1>周浩</h1>
        <p>高级网页设计 · Media Query 响应式布局</p>
    </header>

    <!-- 8个盒子 -->
    <main class="container">
        <div class="box">
            <span class="num">1</span>
            <span class="desc">红色系</span>
        </div>
        <div class="box">
            <span class="num">2</span>
            <span class="desc">橙色系</span>
        </div>
        <div class="box">
            <span class="num">3</span>
            <span class="desc">黄色系</span>
        </div>
        <div class="box">
            <span class="num">4</span>
            <span class="desc">绿色系</span>
        </div>
        <div class="box">
            <span class="num">5</span>
            <span class="desc">青色系</span>
        </div>
        <div class="box">
            <span class="num">6</span>
            <span class="desc">蓝色系</span>
        </div>
        <div class="box">
            <span class="num">7</span>
            <span class="desc">紫色系</span>
        </div>
        <div class="box">
            <span class="num">8</span>
            <span class="desc">粉色系</span>
        </div>
    </main>

    <footer class="footer">
        改变浏览器窗口大小，观察每行盒子数量的变化
    </footer>

</body>
</html>
