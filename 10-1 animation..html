<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-1 背景颜色动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .box {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            /* 4种颜色循环动画，每色2秒，共8秒 */
            animation: changeColor 8s infinite;
        }

        @keyframes changeColor {
            0% {
                background-color: #3498db;
            }
            25% {
                background-color: #e74c3c;
            }
            50% {
                background-color: #2ecc71;
            }
            75% {
                background-color: #f39c12;
            }
            100% {
                background-color: #3498db;
            }
        }
    </style>
</head>
<body>
    <div class="box">周浩</div>
</body>
</html>
