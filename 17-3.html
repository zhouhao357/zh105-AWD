<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="周浩 24001010105">
    <meta name="description" content="商品列表（fetch 获取接口数据）- 周浩 24001010105">
    <title>17-3 商品列表</title>
    <style>
        /* ============================================================
           17-3 商品列表页
           作者：周浩 24001010105 计科24001
           接口：https://dummyjson.com/products?limit=8 （支持跨域）
           点击商品卡片 → 跳转 17-3-detail.html?id=商品ID
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.7;
            padding: 24px 16px;
        }

        .box {
            max-width: 1080px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 6px;
        }

        .sub {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* 请求状态行 */
        .status {
            max-width: 1080px;
            margin: 0 auto 14px;
            font-family: Consolas, monospace;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }

        .status b {
            color: #0f766e;
        }

        .status.err b {
            color: #dc2626;
        }

        /* 重试按钮 */
        .retry {
            display: none;
            margin: 0 auto 14px;
            font: inherit;
            font-size: 14px;
            padding: 7px 18px;
            border: 1px solid #c7d2fe;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 8px;
            cursor: pointer;
        }

        .retry:hover {
            background: #4f46e5;
            color: #fff;
        }

        /* 商品网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, .12);
        }

        .card .pic {
            position: relative;
            background: #fff;
            border-bottom: 1px solid #f1f5f9;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            padding: 10px;
            display: block;
        }

        /* 折扣角标 */
        .card .off {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff455b;
            color: #fff;
            font-size: 12px;
            border-radius: 6px;
            padding: 1px 7px;
        }

        .card .info {
            padding: 10px 12px 14px;
        }

        .card .title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            /* 两行截断 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 48px;
        }

        .card .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
        }

        .card .price {
            margin-top: 4px;
            font-family: Consolas, monospace;
        }

        .card .price b {
            color: #dc2626;
            font-size: 18px;
        }

        .card .price s {
            color: #94a3b8;
            font-size: 12px;
            margin-left: 6px;
        }

        /* 加载中 / 错误提示 */
        .tip {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 14px;
        }

        /* 页脚 */
        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 28px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>商品列表</h1>
        <div class="sub">作者：周浩　学号：24001010105　班级：计科24001　（数据来自 dummyjson.com 接口，fetch 获取）</div>

        <div class="status" id="status">请求地址：https://dummyjson.com/products?limit=8</div>
        <button class="retry" id="btnRetry">↻ 重新加载</button>

        <!-- 商品网格：数据由 fetch 渲染 -->
        <div class="grid" id="grid">
            <div class="tip">加载中…</div>
        </div>

        <footer>周浩 · 高级网页设计 17-3 · 2026</footer>
    </div>

    <script>
        /* ============================================================
         * 17-3 商品列表 —— 作者：周浩 24001010105
         * fetch + async/await + 原生 JS，无任何库
         * ============================================================ */
        var API = 'https://dummyjson.com/products?limit=8';
        var grid = document.getElementById('grid');
        var statusEl = document.getElementById('status');   /* 注意：全局变量不能叫 status（会撞上 window.status） */

        async function loadList() {
            statusEl.className = 'status';
            statusEl.innerHTML = '请求中… <b>' + API + '</b>';
            grid.innerHTML = '<div class="tip">加载中…</div>';
            document.getElementById('btnRetry').style.display = 'none';

            try {
                /* ① 发请求 */
                var res = await fetch(API + '&_=' + Date.now());
                /* ② fetch 收到 404/500 不会自动报错，要自己检查 */
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                /* ③ 解析 JSON */
                var data = await res.json();
                var list = data.products;

                statusEl.innerHTML = '请求成功，状态码 <b>' + res.status + '</b>，共 <b>' +
                    data.total + '</b> 件商品，本页展示 <b>' + list.length + '</b> 件';

                /* ④ map + join 拼卡片，一次性渲染 */
                grid.innerHTML = list.map(function (p) {
                    /* 原价 = 现价 / (1 - 折扣%)，用于划线展示 */
                    var oldPrice = (p.price / (1 - p.discountPercentage / 100)).toFixed(2);
                    return '' +
                        '<a class="card" href="17-3-detail.html?id=' + p.id + '">' +
                        '  <div class="pic">' +
                        '    <span class="off">-' + p.discountPercentage.toFixed(1) + '%</span>' +
                        '    <img src="' + p.thumbnail + '" alt="' + p.title + '" loading="lazy"' +
                        '         onerror="this.src=\'https://dummyjson.com/image/400x400/eee/999?text=No+Image\'">' +
                        '  </div>' +
                        '  <div class="info">' +
                        '    <div class="title">' + p.title + '</div>' +
                        '    <div class="meta"><span>' + (p.brand || p.category) + '</span>' +
                        '    <span>★ ' + p.rating.toFixed(1) + '</span></div>' +
                        '    <div class="price"><b>$' + p.price.toFixed(2) + '</b>' +
                        '    <s>$' + oldPrice + '</s></div>' +
                        '  </div>' +
                        '</a>';
                }).join('');
            } catch (e) {
                statusEl.className = 'status err';
                statusEl.innerHTML = '请求失败：<b>' + e.message + '</b>（请检查网络）';
                grid.innerHTML = '<div class="tip">❌ 商品加载失败</div>';
                document.getElementById('btnRetry').style.display = 'inline-block';
            }
        }

        document.getElementById('btnRetry').addEventListener('click', loadList);
        loadList();
    </script>

</body>
</html>
